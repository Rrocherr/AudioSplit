name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Inspect binary size and generate SHA256SUMS
        shell: pwsh
        run: |
          $exe = Get-Item "target/x86_64-pc-windows-msvc/release/AudioSplit.exe"
          $sizeBytes = $exe.Length
          $sizeKb = [math]::Round($sizeBytes / 1024, 2)
          $sizeMb = [math]::Round($sizeBytes / 1MB, 3)
          Write-Host "AudioSplit.exe size: $sizeBytes bytes ($sizeKb KB / $sizeMb MB)"
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AudioSplit.exe" | Out-File -FilePath "target/x86_64-pc-windows-msvc/release/SHA256SUMS.txt" -Encoding ascii
          Get-Content "target/x86_64-pc-windows-msvc/release/SHA256SUMS.txt"

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/x86_64-pc-windows-msvc/release/AudioSplit.exe
            target/x86_64-pc-windows-msvc/release/SHA256SUMS.txt
